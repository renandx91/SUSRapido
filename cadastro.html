
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | SUS Rápido</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <div class="logo">
        <span>✚</span> SUS Rápido
    </div>

    <a href="index.html" class="voltar">
        Voltar ao início
    </a>
</header>

<main>

    <div class="login-container">

        <div class="icone">✚</div>

        <h1>Crie sua conta</h1>

        <p class="subtitulo">
            Preencha seus dados para começar.
        </p>

        <form id="cadastroForm">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome completo"
                required
            >

            <label for="cpf">CPF</label>
            <input
                type="text"
                id="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
                required
            >

            <label for="nascimento">Data de nascimento</label>
            <input
                type="date"
                id="nascimento"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="seuemail@exemplo.com"
                required
            >

            <label for="senha">Crie uma senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                minlength="8"
                required
            >

            <label for="confirmar">Confirme sua senha</label>
            <input
                type="password"
                id="confirmar"
                placeholder="Digite novamente sua senha"
                required
            >

            <button type="submit">
                Criar minha conta
            </button>

        </form>

        <div class="cadastro">
            Já possui uma conta?
            <a href="login.html">Fazer login</a>
        </div>

        <div class="aviso">
            🔒 Seus dados devem ser protegidos.
        </div>

    </div>

</main>

<footer>
    <p>© 2026 SUS Rápido - Projeto demonstrativo.</p>
</footer>

<script>
document.getElementById("cadastroForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const senha = document.getElementById("senha").value;
    const confirmar = document.getElementById("confirmar").value;

    if (senha !== confirmar) {
        alert("As senhas não são iguais!");
        return;
    }

    alert("Cadastro demonstrativo! O sistema de criação de contas ainda não foi conectado.");
});
</script>

</body>
</html>
