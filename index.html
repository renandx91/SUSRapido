<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SUS Rápido</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <div class="logo">
            <span>✚</span> SUS Rápido
        </div>

        <a href="index.html" class="voltar">
            Voltar ao início
        </a>
    </header>

    <main>
        <div class="login-container">
            <div class="icone">
                ✚
            </div>

            <h1>Bem-vindo!</h1>

            <p class="subtitulo">
                Entre na sua conta para continuar.
            </p>

            <form id="loginForm">
                <label for="cpf">CPF</label>
                <input
                    type="text"
                    id="cpf"
                    placeholder="Digite seu CPF"
                    maxlength="14"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <div class="opcoes">
                    <a href="recuperar.html">
                        Esqueceu sua senha?
                    </a>
                </div>

                <button type="submit">
                    Entrar na conta
                </button>
            </form>

            <div class="cadastro">
                Ainda não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </div>

            <div class="aviso">
                <span>🔒</span>
                Seus dados devem ser protegidos.
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 SUS Rápido - Projeto demonstrativo.</p>
    </footer>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();
            window.location.href = "inicial.html";
        });
    </script>
</body>
</html>
